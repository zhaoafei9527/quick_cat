    <style>
        /* 确保 body 和 html 占满全屏 */
        html, body {
          height: 100%;
          margin: 0;
          padding: 0;
          background: #161413;
          overflow: hidden;
        }
      #loading{
           width: 100%;
           height: 100%;
           display: flex;
           font-size: 22px;
           justify-content: center;
           align-items: center;
           background: #161413;
           color: #fff;
       }

<body>
<div id="loading">
    <img src="splash/splash_page.png" height="100%" alt="">
</div>
<div id="jumpToBrowser" onclick="jumpToBrowser()"></div>
<div id="forceLandscape" onclick="forceLandscape()"></div>
<div id="forcePortrait" onclick="forcePortrait()"></div>
<div id="downloadImage"></div>
<script>

    getPhone();

    function getQueryString(name) {
      var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)', 'i')
      var r = window.location.search.substr(1).match(reg)
      if (r != null) return unescape(r[2])
      return null
    }

    if (getQueryString('debug') === 'true') {
      console.log("开启debug模式")
      var erudaJS = document.createElement('script')
      erudaJS.src = 'https://cdnjs.cloudflare.com/ajax/libs/eruda/3.0.1/eruda.min.js'
      document.body.appendChild(erudaJS)
      erudaJS.onload = function() {
        eruda.init()
      }
    }

    function getPhone() {
        if (window.Phone != null) {
            window.Phone.getAppUUID()
        }
    }

    async function jumpToBrowser() {
        if (window.Phone != null) {
          const rechargeUrl= await window.localStorage.getItem("rechargeUrl");
          if(rechargeUrl!== null && rechargeUrl.length>0){
              window.Phone.jumpToBrowser(rechargeUrl)
              window.localStorage.setItem("rechargeUrl", "");
          }
        }
    }

    function getClipboardDataResult(code) {
        if (code !== null) {
            window.localStorage.setItem("channelInfo", code);
        }
    }


    function getAppUUIDResult(code) {
        if (code !== null) {
            window.localStorage.setItem("uuid",code);
            window.Phone.getClipboardData()
        }
    }

    function forceLandscape() {
        if (window.Phone != null) {
            window.Phone.forceOrientationLandscape()
        }
    }

    function forcePortrait() {
        if (window.Phone != null) {
            window.Phone.forceOrientationPortrait()
        }
    }

      function downloadImage(base64) {
        if (window.Phone != null) {
            window.Phone.downloadImage(base64)
        }
    }

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
              canvasKitBaseUrl:"./static/"
          }).then(function(appRunner) {
            appRunner.runApp();
            document.getElementById("loading").style = "display: none;";
          });
        }
      });
    });
</script>
</body>
</html>
